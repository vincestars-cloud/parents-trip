<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What It Costs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .total { position: sticky; top: 62px; z-index: 4; background: var(--ink); color: #fff; border-radius: var(--r); padding: 16px 20px; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; }
  .total .k { font-size: 15px; opacity: .8; }
  .total .v { font-family: "Outfit", sans-serif; font-size: 36px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .total .vs { grid-column: 1 / -1; font-size: 16px; opacity: .85; }
  .group { display: grid; gap: 10px; }
  .group h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 24px; }
  .group h2 span { font-family: "Atkinson Hyperlegible", sans-serif; font-size: 17px; color: var(--ink-2); font-weight: 400; white-space: nowrap; }
  .group.off { opacity: .45; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; background: var(--accent-wash); color: var(--accent-2); }
  .meter { background: var(--bg-2); border-radius: var(--r); padding: 14px 18px; font-size: 18px; }
  .meter b { font-family: "Outfit", sans-serif; font-weight: 600; }
  .presets { display: flex; gap: 10px; flex-wrap: wrap; }
  .presets .btn { flex: 1 1 160px; min-height: 52px; font-size: 17px; }
  .gave { background: var(--warn-wash); border-radius: var(--r); padding: 14px 18px; font-size: 17px; display: none; }
  .gave.show { display: block; }
  .gave b { font-family: "Outfit", sans-serif; font-weight: 600; }
</style>
</head>
<body>
<div class="nav"><div class="in"><a class="home" href="index.html">← Your trip</a><span class="where">What it costs</span></div></div>
<main class="page">
  <header style="display:grid;gap:10px">
    <h1>Tap the choices. Watch the total.</h1>
    <p class="small">Every price is for the two of you. The ticked ones come from your answers. Tap anything to change it.</p>
  </header>
  <div id="persBox"></div>
  <div class="total"><span class="k">Total for both</span><span class="v" id="totalV">$0</span><span class="vs" id="totalVs"></span></div>
  <div class="presets">
    <button class="btn secondary" id="pFit" type="button">Fit it in $3,500</button>
    <button class="btn secondary" id="pAnswers" type="button">Back to our answers</button>
  </div>
  <div class="meter" id="saveline"></div>
  <div class="gave" id="gaveBox"></div>
  <div id="groups" style="display:grid;gap:36px"></div>
  <section style="display:grid;gap:12px">
    <h2>Send your choices to Vince</h2>
    <button class="btn big" id="sendBtn" type="button">Send to Vince</button>
    <p class="small" id="sendStatus">Nothing is booked by sending. Vince reads your choices and books with you.</p>
    <a class="btn secondary big" href="plan.html">See your plan</a>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="trip.js"></script>
<script>
const A = getAnswers(), D = decide(A), G = CATALOG;
const seeded = costChoices(D);
const nowStamp = stamp(A);
let sel = null;
try { const saved = JSON.parse(localStorage.getItem(COSTS_KEY) || 'null'); if (saved && localStorage.getItem('ptrip.coststamp') === nowStamp) sel = saved; } catch (e) {}
if (!sel) sel = JSON.parse(JSON.stringify(seeded));
G.forEach(g => { if (sel[g.id] == null) sel[g.id] = g.mode === 'one' ? g.o[0].id : []; });
const save = () => { try { localStorage.setItem(COSTS_KEY, JSON.stringify(sel)); localStorage.setItem('ptrip.coststamp', nowStamp); } catch (e) {} };
const money = fmtMoney;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const off = id => groupOff(id, sel);
const gTotal = (g, base) => groupTotal(g, sel, base);
const isSeeded = (g, o) => { const v = seeded[g.id]; return g.mode === 'one' ? v === o.id : Array.isArray(v) && v.includes(o.id); };
function seededTotal() { const keep = sel; sel = seeded; const r = totals(sel).inside; sel = keep; return r; }
function reasonFor(id) {
  return ({
    flights: D.skipAUH ? '' : '',
    stopover: D.skipAUH ? 'no, straight through to Bangkok' : (A.stopover === 'yes' ? 'yes, one night in Abu Dhabi' : ''),
    bkk: D.nearHospital ? 'walking distance to the hospital matters' : (D.comfort && D.wantsPool ? 'you would pay more for the nicer place, and you want a pool' : (D.frugal ? 'you would rather save it for food and outings' : '')),
    cnx: D.comfort && D.wantsQuiet ? 'quiet at night matters' : '',
    food: D.acFood ? 'you prefer restaurants with air conditioning' : (D.streetFood ? 'yes, take me to the night market' : (D.frugal ? 'you would rather save it' : '')),
    transport: D.noStairs ? 'please avoid stairs' : (D.hot ? 'keep me in air conditioning' : ''),
    phone: D.tmobile ? 'you are with T-Mobile, so this is already included' : (D.phoneUnsure ? 'you are not sure which phone you have' : ''),
    layover: A.layover_home ? 'what you chose for the night at the airport' : '',
    cnxdo: D.elephants ? 'yes to the elephants' : (A.elephants ? 'the elephants only if it is easy' : ''),
    bkkdo: A.birthday ? 'the birthday dinner you chose' : '',
    medical: (A.checkup || A.dental_type) ? 'what you said about the check-up and the dentist' : '',
    auh: D.lowEnergyAUH ? 'you would rather take the Abu Dhabi day slowly' : ''
  })[id] || '';
}
function render() {
  const { inside, cushion, outside, base } = totals(sel);
  document.getElementById('totalV').textContent = money(inside);
  const diff = BUDGET - inside;
  document.getElementById('totalVs').textContent = (diff >= 0 ? money(diff) + ' under the $3,500 budget' : money(-diff) + ' over the $3,500 budget') + ' · plus about ' + money(cushion) + ' to carry as a cushion · medical ' + money(outside) + ' on top';
  const s = seededTotal() - inside;
  document.getElementById('saveline').innerHTML = !D.answered
    ? 'These are the standard choices. <a href="questions.html">Answer the questions</a> and they change to match you.'
    : (s > 0 ? '<b>' + money(s) + ' cheaper</b> than what your answers picked.' : (s < 0 ? '<b>' + money(-s) + ' more</b> than what your answers picked.' : 'This is what your answers picked. Tap anything to change it.'));
  let h = '';
  G.forEach(g => {
    const isOff = off(g.id), rsn = reasonFor(g.id);
    h += '<section class="group' + (isOff ? ' off' : '') + '"><h2>' + esc(g.title) + '<span>' + (isOff ? 'not counted' : (g.outside ? 'outside · ' : '') + money(gTotal(g, base))) + '</span></h2>';
    if (rsn && !isOff && D.answered) h += why(esc(rsn));
    h += '<div class="options">';
    g.o.forEach(o => {
      const on = g.mode === 'one' ? sel[g.id] === o.id : (sel[g.id] || []).includes(o.id);
      const price = o.dyn === 'buffer' ? money(base * 0.10) : (o.p === 0 ? 'Free' : money(o.p));
      h += '<button type="button" class="opt priced' + (g.mode === 'many' ? ' check' : '') + '" role="' + (g.mode === 'one' ? 'radio' : 'checkbox') + '" aria-checked="' + on + '" data-g="' + g.id + '" data-o="' + o.id + '"><span class="box"></span><span><span class="lbl">' + esc(o.l) + (D.answered && isSeeded(g, o) ? '<span class="tag">Your answers</span>' : '') + '</span>' + (o.s ? '<span class="sub">' + esc(o.s) + '</span>' : '') + '</span><span class="price">' + price + '</span></button>';
    });
    h += '</div></section>';
  });
  document.getElementById('groups').innerHTML = h;
  document.getElementById('persBox').innerHTML = personalBanner(A);
  markStamp(A);
  document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const g = G.find(x => x.id === b.dataset.g), o = b.dataset.o;
    if (g.mode === 'one') sel[g.id] = o;
    else {
      const arr = (sel[g.id] || []).slice(), i = arr.indexOf(o);
      if (i >= 0) arr.splice(i, 1);
      else { arr.push(o); EXCLUSIVE.forEach(set => { if (set.includes(o)) set.filter(x => x !== o).forEach(x => { const j = arr.indexOf(x); if (j >= 0) arr.splice(j, 1); }); }); }
      sel[g.id] = arr;
    }
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  }));
}
render();
document.getElementById('pFit').addEventListener('click', () => {
  const r = fitBudget(sel, BUDGET);
  sel = r.sel; save(); render();
  const box = document.getElementById('gaveBox');
  if (!r.gave.length) box.innerHTML = '<b>Already under $3,500.</b> Nothing had to go.';
  else box.innerHTML = '<b>' + (r.fits ? 'Now ' + money(r.total) + '.' : 'Trimmed to ' + money(r.total) + ', still over.') + '</b> To get there it dropped: ' + r.gave.join('; ') + '. Tap anything back on if you would rather keep it and go over.';
  box.classList.add('show'); box.scrollIntoView({ block: 'nearest' });
});
document.getElementById('pAnswers').addEventListener('click', () => {
  sel = JSON.parse(JSON.stringify(seeded)); save(); render();
  document.getElementById('gaveBox').classList.remove('show');
  window.scrollTo({ top: 0 });
});
const toastEl = document.getElementById('toast');
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2000); }
document.getElementById('sendBtn').addEventListener('click', async () => {
  const btn = document.getElementById('sendBtn'), st = document.getElementById('sendStatus');
  btn.disabled = true; st.textContent = 'Sending…';
  const { inside, outside, base } = totals(sel), answers = {}, labels = {};
  G.forEach(g => { answers['cost_' + g.id] = off(g.id) ? 'not counted' : (g.mode === 'one' ? (g.o.find(o => o.id === sel[g.id]) || {}).l : g.o.filter(o => (sel[g.id] || []).includes(o.id)).map(o => o.l)); labels['cost_' + g.id] = g.title + ' (' + money(gTotal(g, base)) + ')'; });
  answers.total_inside = money(inside); labels.total_inside = 'Total for both';
  answers.total_medical = money(outside); labels.total_medical = 'Medical, outside';
  try {
    const body = new URLSearchParams();
    body.set('payload', JSON.stringify({ token: 'ptrip_2026_kx7Qm9', who: A.who || 'unknown', section: 'costs', answers, labels, sentAt: new Date().toISOString() }));
    const r = await fetch('https://n8n.americanlifeteam.com/webhook/parents-trip-answers', { method: 'POST', body });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { st.textContent = 'Sent. Vince has your choices.'; btn.textContent = 'Sent'; toast('Sent to Vince'); } else throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) { st.textContent = 'It did not go through (' + e.message + '). Try again in a minute.'; btn.disabled = false; }
});
</script>
</body>
</html>
