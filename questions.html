<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .q h1 { font-size: 32px; }
  .review { display: grid; gap: 0; }
  .review div { display: grid; gap: 2px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .review .q { color: var(--ink-2); font-size: 16px; }
  .review .a { font-weight: 700; }
  .review .a.empty { color: var(--ink-2); font-weight: 400; }
  .runtot { max-width: 820px; margin: 0 auto; padding: 8px 20px 10px; display: flex; align-items: baseline; gap: 10px; }
  .runtot .lab { font-size: 15px; color: var(--ink-2); }
  .runtot .num { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; margin-left: auto; }
  .runtot .delta { font-family: "Outfit", sans-serif; font-weight: 600; font-size: 16px; min-width: 62px; text-align: right; opacity: 0; transition: opacity .25s; }
  .runtot .delta.show { opacity: 1; }
  .runtot .delta.down { color: #157347; }
  .runtot .delta.up { color: var(--warn); }
  @media (prefers-reduced-motion: reduce) { .runtot .delta { transition: none; } }
  .done { display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="nav"><div class="in"><a class="home" href="index.html">← Your trip</a><span class="where" id="stepLabel">Questions</span></div><div class="progress"><span id="bar" style="width:0%"></span></div>
<div class="runtot" id="runtot"><span class="lab">Your trip so far</span><span class="num" id="runNum">$0</span><span class="delta" id="runDelta"></span></div></div>
<main class="page" id="view" aria-live="polite"></main>
<div class="bottom"><div class="in"><button class="btn secondary" id="backBtn" type="button">Back</button><button class="btn" id="nextBtn" type="button">Next</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="trip.js"></script>
<script>
const Q = [
  { id: 'who', type: 'single', text: 'Who is answering?', options: [ { v: 'Stella', l: 'Stella' }, { v: 'Cajetan', l: 'Cajetan' }, { v: 'Both', l: 'Both of us' } ] },
  { id: 'i_fly', type: 'intro', title: 'The flights', img: 'img/etihad_a350.jpg', body: 'Two long flights each way. Atlanta to Abu Dhabi is 14 hours, a little longer than Atlanta to Lagos. Both are overnight.' },
  { id: 'seat', type: 'single', text: 'Window or aisle?', help: 'On a 14-hour flight most people pick the aisle so they can get up.', options: [ { v: 'aisle', l: 'Aisle' }, { v: 'window', l: 'Window' }, { v: 'any', l: 'Either' } ] },
  { id: 'sleep_plane', type: 'single', text: 'Can you sleep on a plane?', options: [ { v: 'well', l: 'Yes' }, { v: 'poorly', l: 'Not really' }, { v: 'unknown', l: 'Never tried one this long' } ] },
  { id: 'stopover', type: 'single', text: 'Stop one night in Abu Dhabi on the way?', img: 'img/grand_mosque.jpg', help: 'The airline pays for the hotel. It will be about 105°F, so the day is planned indoors.', options: [ { v: 'yes', l: 'Yes, one night' }, { v: 'no', l: 'No, straight to Bangkok' }, { v: 'vince', l: 'Let Vince decide' } ] },
  { id: 'layover_home', type: 'single', text: 'Coming home there is an 8-hour wait overnight in the Abu Dhabi airport. What would you prefer?', options: [ { v: 'hotel', l: 'A room inside the airport, about $125' }, { v: 'lounge', l: 'A lounge with recliners, about $50 each' }, { v: 'terminal', l: 'Rest in the terminal, free' } ] },
  { id: 'i_sleep', type: 'intro', title: 'Where you sleep', img: 'img/chao_phraya.jpg', body: 'In Thailand a clean 4-star hotel with a pool costs what a roadside motel costs in Georgia. No hostels.' },
  { id: 'hotel_matters', type: 'multi', max: 3, text: 'What matters most in a hotel? Pick up to three.', options: [ { v: 'clean', l: 'Spotless' }, { v: 'quiet', l: 'Quiet at night' }, { v: 'breakfast', l: 'Breakfast included' }, { v: 'pool', l: 'A pool' }, { v: 'elevator', l: 'An elevator' }, { v: 'hospital', l: 'Walking distance to the hospital' }, { v: 'bath', l: 'A bathtub' } ] },
  { id: 'beds', type: 'single', text: 'One big bed or two?', options: [ { v: 'one', l: 'One big bed' }, { v: 'two', l: 'Two beds' }, { v: 'either', l: 'Either' } ] },
  { id: 'money_style', type: 'single', text: 'Which sounds more like you?', options: [ { v: 'comfort', l: 'I would pay $30 more a night for the nicer place' }, { v: 'save', l: 'I would rather save the $30 for food and outings' }, { v: 'middle', l: 'In the middle' } ] },
  { id: 'i_food', type: 'intro', title: 'Food', img: 'img/pad_thai.jpg', body: 'Rice, noodles, grilled chicken and fish, soups, fresh fruit. It can be spicy, but every cook makes it mild if you ask.' },
  { id: 'food_adventure', type: 'single', text: 'How adventurous are you with food?', options: [ { v: 'any', l: 'I will try anything once' }, { v: 'careful', l: 'New food if it looks clean and cooked' }, { v: 'familiar', l: 'Mostly food I know' } ] },
  { id: 'spice', type: 'single', text: 'Spicy?', help: '“Mai phet” (my pet) means not spicy.', options: [ { v: 'love', l: 'Yes, like pepper soup' }, { v: 'little', l: 'A little' }, { v: 'none', l: 'None, please' } ] },
  { id: 'street_food', type: 'single', text: 'Would you eat at the famous night-market street?', img: 'img/yaowarat.jpg', options: [ { v: 'yes', l: 'Yes, take me there' }, { v: 'ac', l: 'I prefer restaurants with air conditioning' }, { v: 'mix', l: 'A mix' } ] },
  { id: 'avoid_food', type: 'text', text: 'Anything you cannot or will not eat?', help: 'Allergies, doctor’s orders, dislikes. Or “nothing”.' },
  { id: 'i_body', type: 'intro', title: 'Walking, heat, your body', img: 'img/doi_suthep.jpg', body: 'Honest answers make the trip better, not smaller. Every day has rests, and every place has an easier way in.' },
  { id: 'walk', type: 'single', text: 'How far can you walk before you need to sit?', help: 'A Walmart parking lot end to end is about 5 minutes. A lap of Lenox Square is about 15.', options: [ { v: '30', l: '30 minutes or more' }, { v: '15', l: 'About 15 minutes' }, { v: '5', l: '5 to 10 minutes' } ] },
  { id: 'stairs', type: 'single', text: 'Stairs?', options: [ { v: 'fine', l: 'Fine' }, { v: 'some', l: 'A flight or two' }, { v: 'avoid', l: 'Please avoid them' } ] },
  { id: 'heat', type: 'single', text: 'Heat?', help: 'Bangkok in September is like Atlanta in late July. Abu Dhabi is hotter than anywhere in Georgia.', options: [ { v: 'fine', l: 'Does not bother me' }, { v: 'breaks', l: 'Fine with water and breaks' }, { v: 'struggle', l: 'Keep me in air conditioning' } ] },
  { id: 'mobility', type: 'multi', text: 'Anything we should know? Pick all that apply.', options: [ { v: 'none', l: 'Nothing, I get around fine' }, { v: 'cane', l: 'I sometimes use a cane' }, { v: 'wheelchair', l: 'A wheelchair at the airports, please (free)' }, { v: 'knees', l: 'Bad knees or hips' } ] },
  { id: 'i_do', type: 'intro', title: 'Things to see and do', img: 'img/wat_arun.jpg', body: 'You cannot see everything. Tell us what you would be sorry to miss.' },
  { id: 'must_see', type: 'multi', text: 'What would you be sorry to miss?', help: 'Pick the kinds of thing you want. One of each beats five of the same: you will not remember the fourth temple, but you will remember a camel.', options: [ { v: 'camels', l: 'Riding a camel in the desert', img: 'img/grand_mosque.jpg' }, { v: 'elephants', l: 'Elephants at a rescue sanctuary', img: 'img/elephant_nature_park.jpg' }, { v: 'shopping', l: 'A souk, and real oud or perfume', img: 'img/yaowarat.jpg' }, { v: 'markets', l: 'Big markets to buy things in', img: 'img/night_bazaar.jpg' }, { v: 'river', l: 'A floating market or a river boat', img: 'img/chao_phraya.jpg' }, { v: 'temples', l: 'The Grand Palace, once', img: 'img/wat_pho.jpg' }, { v: 'mountain', l: 'The temple on the mountain', img: 'img/doi_suthep.jpg' }, { v: 'cooking', l: 'Cooking Thai food yourself', img: 'img/pad_thai.jpg' }, { v: 'ruins', l: 'A day out at the old ruined city' }, { v: 'massage', l: 'A Thai massage' } ] },
  { id: 'elephants', type: 'single', text: 'The elephants: how much do you want this?', img: 'img/elephant_nature_park.jpg', help: 'A half day, $77 each. You walk beside them on a flat path and feed them. Can be muddy. It and the camels are the two most expensive things you will do, and the two you will most remember.', options: [ { v: 'yes', l: 'Yes, even if muddy' }, { v: 'easy', l: 'Only if it is easy' }, { v: 'no', l: 'No thank you' } ] },
  { id: 'budget_rule', type: 'single', text: 'The trip fits $3,500 only if some things go. Which comes first?', help: 'Flights and suitcases alone are $2,201, and insurance is $200. That leaves about $1,100 for six nights of hotel, six days of food, all the taxis, and everything you do.', options: [ { v: 'keep', l: 'Keep the camels and the elephants, spend a little over' }, { v: 'fit', l: 'Stay under $3,500, even if we drop one of them' }, { v: 'vince', l: 'Let Vince decide' } ] },
  { id: 'birthday', type: 'single', text: 'Stella’s birthday dinner. Which sounds best?', options: [ { v: 'rooftop', l: 'A rooftop table facing the lit-up temple' }, { v: 'cruise', l: 'A dinner cruise with music' }, { v: 'chinatown', l: 'Street food in Chinatown' }, { v: 'quiet', l: 'A quiet restaurant near the hotel' } ] },
  { id: 'pace', type: 'single', text: 'What pace?', options: [ { v: 'full', l: 'Full days, see a lot' }, { v: 'one', l: 'One main thing a day, then rest' }, { v: 'slow', l: 'Mornings out, afternoons in' } ] },
  { id: 'i_health', type: 'intro', title: 'The dentist and the check-up', body: 'Bumrungrad is like Emory in Atlanta: big, modern, everyone speaks English. The check-up is done in one day. The dental hospital is across the road.' },
  { id: 'dental_type', type: 'single', text: 'Dad, what did the dentist say you need?', help: 'Everything fits in the three Bangkok days except an implant, which needs two trips.', options: [ { v: 'crown', l: 'A crown (a cap)' }, { v: 'root', l: 'A root canal' }, { v: 'extraction', l: 'Pull a tooth' }, { v: 'implant', l: 'An implant' }, { v: 'bridge', l: 'A bridge' }, { v: 'unsure', l: 'Not sure, I will ask' } ] },
  { id: 'checkup', type: 'single', text: 'The full check-up. Who wants it?', help: 'About $1,000 each for the version built for your age.', options: [ { v: 'both', l: 'Both of us' }, { v: 'me', l: 'Only me' }, { v: 'neither', l: 'Neither' } ] },
  { id: 'health_notes', type: 'text', text: 'Anything about your health the planner should know?', help: 'Daily medicines, conditions, recent surgery. Only Vince reads this.' },
  { id: 'i_admin', type: 'intro', title: 'Phone and papers', img: 'img/bts_skytrain.jpg', body: 'Three quick ones so nothing surprises you at the airport.' },
  { id: 'phone', type: 'single', text: 'What phone do you have?', help: 'Type the model on the next screen if you know it.', options: [ { v: 'iphone', l: 'iPhone' }, { v: 'android', l: 'Android (Samsung, Google…)' }, { v: 'unsure', l: 'Not sure' } ] },
  { id: 'phone_model', type: 'text', text: 'Which model, if you know?', help: 'iPhone: Settings, General, About. Leave blank if unsure.' },
  { id: 'carrier', type: 'single', text: 'Your phone company?', options: [ { v: 'att', l: 'AT&T' }, { v: 'verizon', l: 'Verizon' }, { v: 'tmobile', l: 'T-Mobile' }, { v: 'other', l: 'Other / not sure' } ] },
  { id: 'passport', type: 'single', text: 'Is your passport valid past March 2027?', help: 'Look at the expiry line.', options: [ { v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }, { v: 'check', l: 'I need to check' } ] },
  { id: 'worries', type: 'text', text: 'What worries you most about this trip?' },
  { id: 'wish', type: 'text', text: 'Anything you have always wanted to see or do there?' },
  { id: 'review', type: 'review', title: 'Check, then send to Vince' }
];
const LABELS = {}; Q.forEach(q => { if (q.text) LABELS[q.id] = q.text; });
const STORE = 'ptrip.answers.v2', POS = 'ptrip.pos.v2', ENDPOINT = 'https://n8n.americanlifeteam.com/webhook/parents-trip-answers', TOKEN = 'ptrip_2026_kx7Qm9';
let answers = {}; try { answers = JSON.parse(localStorage.getItem(STORE) || localStorage.getItem('ptrip.answers.v1') || '{}') || {}; } catch (e) {}
let pos = 0; try { pos = Math.min(parseInt(localStorage.getItem(POS) || '0', 10) || 0, Q.length - 1); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(answers)); localStorage.setItem(POS, String(pos)); } catch (e) {} updateTotal(); };
let lastTotal = null;
function updateTotal() {
  const t = totals(costChoices(decide(answers))).inside;
  const numEl = document.getElementById('runNum'), dEl = document.getElementById('runDelta');
  numEl.textContent = fmtMoney(t);
  if (lastTotal !== null && Math.round(t) !== Math.round(lastTotal)) {
    const diff = t - lastTotal;
    dEl.textContent = (diff > 0 ? '+' : '\u2212') + fmtMoney(Math.abs(diff));
    dEl.className = 'delta show ' + (diff > 0 ? 'up' : 'down');
    clearTimeout(updateTotal._t); updateTotal._t = setTimeout(() => { dEl.className = 'delta'; }, 2200);
  }
  lastTotal = t;
}
const view = document.getElementById('view'), backBtn = document.getElementById('backBtn'), nextBtn = document.getElementById('nextBtn'), toastEl = document.getElementById('toast');
function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2000); }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const qs = Q.filter(q => q.type !== 'intro' && q.type !== 'review');
function qNumber(i) { let n = 0; for (let k = 0; k <= i; k++) if (Q[k].type !== 'intro' && Q[k].type !== 'review') n++; return n; }
function labelFor(q, v) { if (!q.options) return v; const o = q.options.find(o => o.v === v); return o ? o.l : v; }
function render() {
  const q = Q[pos], total = qs.length;
  document.getElementById('bar').style.width = Math.round((qNumber(pos) / total) * 100) + '%';
  document.getElementById("stepLabel").textContent = (q.type === "intro" || q.type === "review") ? "" : (qNumber(pos) + " of " + total);
  window.scrollTo({ top: 0 });
  let h = '';
  if (q.type === 'intro') {
    h += (q.img ? '<figure class="photo"><img src="' + q.img + '" alt=""></figure>' : '') + '<section class="q" style="display:grid;gap:10px"><h1>' + esc(q.title) + '</h1><p>' + esc(q.body) + '</p></section>';
    nextBtn.textContent = 'Continue';
  } else if (q.type === 'review') {
    h += '<section class="q" style="display:grid;gap:8px"><h1>' + esc(q.title) + '</h1><p class="small">Tap an answer to change it. Blank ones are fine.</p></section><div class="review">';
    qs.forEach(qq => { const v = answers[qq.id]; const shown = v == null || v === '' || (Array.isArray(v) && !v.length) ? '' : (Array.isArray(v) ? v.map(x => labelFor(qq, x)).join(', ') : labelFor(qq, v)); h += '<div role="button" tabindex="0" data-goto="' + Q.indexOf(qq) + '"><span class="q">' + esc(qq.text) + '</span><span class="a' + (shown ? '' : ' empty') + '">' + (shown ? esc(shown) : 'Not answered') + '</span></div>'; });
    h += '</div><section class="done"><button class="btn big" id="sendBtn" type="button">Send to Vince</button><p class="small" id="sendStatus">Nothing is booked by sending.</p><a class="btn secondary big" href="plan.html">See your plan</a><a class="btn secondary big" href="costs.html">See what it costs</a></section>';
    nextBtn.textContent = 'Done';
  } else {
    h += '<section class="q" style="display:grid;gap:10px"><h1>' + esc(q.text) + '</h1>' + (q.help ? '<p class="small">' + esc(q.help) + '</p>' : '') + '</section>';
    if (q.img) h += '<figure class="photo"><img src="' + q.img + '" alt=""></figure>';
    if (q.type === 'text') h += '<textarea id="ta" aria-label="' + esc(q.text) + '" placeholder="Type here">' + esc(answers[q.id] || '') + '</textarea>';
    else { const cur = answers[q.id]; h += '<div class="options" role="' + (q.type === 'single' ? 'radiogroup' : 'group') + '">'; q.options.forEach(o => { const on = q.type === 'single' ? cur === o.v : Array.isArray(cur) && cur.includes(o.v); h += '<button type="button" class="opt' + (q.type === 'multi' ? ' check' : '') + (o.img ? ' withimg' : '') + '" role="' + (q.type === 'single' ? 'radio' : 'checkbox') + '" aria-checked="' + (on ? 'true' : 'false') + '" data-v="' + esc(o.v) + '"><span class="box"></span>' + (o.img ? '<img src="' + o.img + '" alt="">' : '') + '<span><span class="lbl">' + esc(o.l) + '</span></span></button>'; }); h += '</div>'; }
    nextBtn.textContent = pos === Q.length - 2 ? 'Review' : 'Next';
  }
  view.innerHTML = h; backBtn.disabled = pos === 0;
  view.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => { const v = b.dataset.v; if (q.type === 'single') { answers[q.id] = v; save(); render(); setTimeout(next, 300); return; } let arr = Array.isArray(answers[q.id]) ? answers[q.id].slice() : []; if (arr.includes(v)) arr = arr.filter(x => x !== v); else { if (q.max && arr.length >= q.max) { toast('Pick up to ' + q.max); return; } arr.push(v); } answers[q.id] = arr; save(); render(); }));
  const ta = document.getElementById('ta'); if (ta) { ta.addEventListener('input', () => { answers[q.id] = ta.value; save(); }); }
  view.querySelectorAll('[data-goto]').forEach(d => { const go = () => { pos = +d.dataset.goto; save(); render(); }; d.addEventListener('click', go); d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  const sb = document.getElementById('sendBtn'); if (sb) sb.addEventListener('click', send);
}
function next() { if (pos < Q.length - 1) { pos++; save(); render(); } else location.href = 'index.html'; }
function back() { if (pos > 0) { pos--; save(); render(); } }
nextBtn.addEventListener('click', next); backBtn.addEventListener('click', back);
async function send() {
  const btn = document.getElementById('sendBtn'), st = document.getElementById('sendStatus'); btn.disabled = true; st.textContent = 'Sending…';
  try { const body = new URLSearchParams(); body.set('payload', JSON.stringify({ token: TOKEN, who: answers.who || 'unknown', section: 'all', answers, labels: LABELS, sentAt: new Date().toISOString() }));
    const r = await fetch(ENDPOINT, { method: 'POST', body }); const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { st.textContent = 'Sent. Vince has your answers.'; btn.textContent = 'Sent'; toast('Sent to Vince'); } else throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) { st.textContent = 'It did not go through (' + e.message + '). Your answers are saved here. Try again in a minute.'; btn.disabled = false; }
}
render();
updateTotal();
</script>
</body>
</html>
